name: Build TSData to EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Tải mã nguồn về máy chủ
      uses: actions/checkout@v4

    - name: Thiết lập môi trường Java 8 (Có sẵn JavaFX của Zulu)
      uses: actions/setup-java@v5
      with:
        java-version: '8'
        distribution: 'zulu'
        java-package: 'jdk+fx'

    - name: Biên dịch mã nguồn bằng Gradle
      run: .\gradlew.bat build
      shell: cmd

    - name: Tải công cụ đóng gói Launch4j (Bypass Mirror)
      run: |
        curl.exe -L -o launch4j.zip "https://jaist.dl.sourceforge.net/project/launch4j/launch4j-3/3.14/launch4j-3.14-win32.zip"
        Expand-Archive -Path launch4j.zip -DestinationPath launch4j -Force
      shell: powershell

    - name: Đóng gói dữ liệu thành EXE
      run: |
        # Tìm lõi file jar vừa được biên dịch
        $jarFile = Get-ChildItem -Path "build\libs" -Filter "*.jar" | Select-Object -First 1
        if (-not $jarFile) {
            Write-Error "Không tìm thấy file lõi .jar sau khi build!"
            exit 1
        }
        
        # Thiết lập bảng cấu hình ép kiểu cho Launch4j
        $xml = @"
        <launch4jConfig>
          <dontWrapJar>false</dontWrapJar>
          <headerType>gui</headerType>
          <jar>$($jarFile.FullName)</jar>
          <outfile>TSDataEditor.exe</outfile>
          <jre>
            <minVersion>1.8.0</minVersion>
            <jdkPreference>preferJre</jdkPreference>
          </jre>
        </launch4jConfig>
        "@
        Set-Content -Path config.xml -Value $xml
        
        .\launch4j\launch4j\launch4jc.exe config.xml
      shell: powershell

    - name: Xuất xưởng file thành phẩm
      uses: actions/upload-artifact@v4
      with:
        name: Tool-TSData-Editor
        path: |
          TSDataEditor.exe
          build/libs/*.jar
